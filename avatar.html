<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avatar</title>
<!--
  AVATAR — swap a person's live camera for one of their prebuilt faces.
  An OBS browser source between the masked camera and its camera frame,
  exactly the frame's size and position ("Avatar 1" under "Frame 1"; the setup script adds it and keeps it lined up). While a face is
  on, it covers the camera inside the ring; "Live camera" hides it again.
  The faces for each seat are listed in avatars/avatars.js.

  URL settings:
    ?id=1            the seat (same as the camera frame's id)
    &shape=circle    circle, rounded or hexagon (normally learned from the frame)

  ── For developers ─────────────────────────────────────────────
  Type:      OBS browser source, designed at 600 × 660 like frame.html; the face fills the
             camera circle (centre 300,300, radius 281, just under the ring).
  Uses:      theme.css, shared.js, avatars/avatars.js, lib/anime.umd.min.js (the pop when the
             face changes and the bob while talking).
  Messages:  listens  to:"avatar" {id: "1".."4" | "*"} cmd: face {n (1-based) | name} · on {on} ·
                      toggle · next · prev · ping
                      to:"frame" talk {id, on, lvl} (bobs along with the speaking light)
                      from:"frame" {id, shape}
             sends    from:"avatar" {id, on, face, faces:[names]} after every change and on ping
  Saved:     localStorage "awym-avatar-v1" {seat: {on, face}}, so a reload keeps the face.
-->
<link rel="stylesheet" href="theme.css">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  .stage { width: 600px; height: 660px; position: relative; flex: none; transform-origin: center; }
  svg { position: absolute; left: 0; top: 0; width: 600px; height: 600px; overflow: visible; }
  #all { opacity: 0; transition: opacity .35s; }
  .on #all { opacity: 1; }
  .face { transition: opacity .18s; }
  .test { position: fixed; left: 6px; top: 6px; display: none; flex-wrap: wrap; gap: 4px; font: 13px system-ui, sans-serif; z-index: 2; max-width: 98vw; }
  .test.on { display: flex; }
  .test button { font: inherit; padding: 4px 8px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg viewBox="0 0 600 600" aria-hidden="true">
    <defs><clipPath id="clip"><path id="clipPath"/></clipPath></defs>
    <g id="all" clip-path="url(#clip)">
      <rect id="bg" x="0" y="0" width="600" height="600" fill="#c7c7c7"/>
      <g id="puppet">
        <image class="face" id="imgA" x="0" y="8" width="600" height="600" preserveAspectRatio="xMidYMid slice" opacity="0"/>
        <image class="face" id="imgB" x="0" y="8" width="600" height="600" preserveAspectRatio="xMidYMid slice" opacity="0"/>
      </g>
    </g>
  </svg>
</div>
<div class="test" id="test"></div>
<script src="shared.js"></script>
<script src="avatars/avatars.js"></script>
<script src="lib/anime.umd.min.js"></script>
<script>
(function () {
  "use strict";
  const A = window.anime || null;
  const id = AWYM.param("id", "1");
  const SET = (window.AWYM_AVATARS || {})[id] || { faces: [] };
  const FACES = SET.faces || [];
  let shape = AWYM.param("shape", "circle");
  const stage = document.getElementById("stage");
  function fit() { stage.style.transform = "scale(" + Math.min(innerWidth / 600, innerHeight / 660) + ")"; }
  addEventListener("resize", fit); fit();
  if (SET.bg) document.getElementById("bg").setAttribute("fill", SET.bg);

  /* the camera's shape (same outlines as frame.html), a little under the ring */
  function outline(r) {
    const c = 300;
    if (shape === "hexagon") { const p = []; for (let i = 0; i < 6; i++) { const a = (60 * i - 90) * Math.PI / 180; p.push((c + r * Math.cos(a)).toFixed(1) + "," + (c + r * Math.sin(a)).toFixed(1)); } return "M" + p.join("L") + "Z"; }
    if (shape === "rounded") { const k = r * 2 * 0.18, x = c - r, y = c - r, s = r * 2; return `M${x + k},${y}H${x + s - k}Q${x + s},${y} ${x + s},${y + k}V${y + s - k}Q${x + s},${y + s} ${x + s - k},${y + s}H${x + k}Q${x},${y + s} ${x},${y + s - k}V${y + k}Q${x},${y} ${x + k},${y}Z`; }
    return `M${c - r},${c}a${r},${r} 0 1,0 ${r * 2},0a${r},${r} 0 1,0 ${-r * 2},0Z`;
  }
  const setShape = () => document.getElementById("clipPath").setAttribute("d", outline(281));
  setShape();

  /* state (kept across reloads) */
  const KEY = "awym-avatar-v1";
  let all = {}; try { all = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  const st = Object.assign({ on: false, face: 0 }, all[id] || {});
  const save = () => { try { all = JSON.parse(localStorage.getItem(KEY) || "{}"); all[id] = { on: st.on, face: st.face }; localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) {} };
  const report = () => AWYM.send({ from: "avatar", id, on: st.on && FACES.length > 0, face: st.face, faces: FACES.map((f) => f.name) });

  /* preload every face */
  const base = (document.currentScript && document.currentScript.src || location.href).replace(/[?#].*$/, "").replace(/[^/]*$/, "") + "avatars/";
  FACES.forEach((f) => { const i = new Image(); i.src = base + f.file; });

  const imgs = [document.getElementById("imgA"), document.getElementById("imgB")];
  let front = 0, shown = -1;
  /** Show face n (0-based): cross-fade, with a little pop. */
  function draw(n, pop) {
    if (!FACES.length) return;
    n = ((n % FACES.length) + FACES.length) % FACES.length;
    if (n === shown) return;
    shown = n;
    const back = imgs[1 - front], cur = imgs[front];
    back.setAttribute("href", base + FACES[n].file);
    back.setAttribute("opacity", "1"); cur.setAttribute("opacity", "0");
    front = 1 - front;
    if (pop && A) {
      A.remove(puppetS);
      puppetS.s = 0.9;
      A.animate(puppetS, { s: 1, duration: 520, ease: "outElastic(1, .55)", onUpdate: applyPuppet });
    }
  }
  function setOn(on) { st.on = !!on && FACES.length > 0; document.body.classList.toggle("on", st.on); }
  function apply(pop) { draw(st.face, pop); setOn(st.on); save(); report(); }

  /* talking: a small bob that follows the voice (from the Show Runner's speaking light) */
  const puppetS = { s: 1, y: 0, r: 0 };
  const puppet = document.getElementById("puppet");
  function applyPuppet() { puppet.setAttribute("transform", `translate(300 ${300 + puppetS.y}) rotate(${puppetS.r}) scale(${puppetS.s}) translate(-300 -300)`); }
  let talkLvl = 0, talking = false, raf = 0, t0 = 0, talkOff = null;
  function bob(now) {
    const t = (now - t0) / 1000;
    const k = talking ? 0.35 + 0.65 * talkLvl : 0;
    puppetS.y = -Math.abs(Math.sin(t * 9)) * 7 * k;
    puppetS.r = Math.sin(t * 4.3) * 1.2 * k;
    applyPuppet();
    if (talking || Math.abs(puppetS.y) > 0.2) raf = requestAnimationFrame(bob); else { raf = 0; puppetS.y = 0; puppetS.r = 0; applyPuppet(); }
  }
  function talk(on, lvl) {
    talking = !!on && st.on; talkLvl = isFinite(lvl) ? Math.max(0, Math.min(1, lvl)) : 0.6;
    clearTimeout(talkOff); if (talking) talkOff = setTimeout(() => talk(false), 3000);
    if (talking && !raf) { t0 = performance.now(); raf = requestAnimationFrame(bob); }
  }

  /* commands */
  function faceIndex(v) {
    if (typeof v === "number" || /^\d+$/.test(String(v))) return Number(v) - 1;
    const i = FACES.findIndex((f) => f.name.toLowerCase() === String(v).toLowerCase());
    return i;
  }
  AWYM.listen((m) => {
    if (m.from === "frame" && String(m.id) === id && m.shape && m.shape !== shape && !AWYM.param("shape")) { shape = m.shape; setShape(); return; }
    if (m.to === "frame" && m.cmd === "talk" && String(m.id) === id) { talk(m.on, m.lvl); return; }
    if (m.to !== "avatar" || !(String(m.id) === id || m.id === "*")) return;
    if (m.cmd === "ping") { report(); return; }
    if (!FACES.length) { report(); return; }
    if (m.cmd === "face") { const i = faceIndex(m.n != null ? m.n : m.name); if (i >= 0 && i < FACES.length) { st.face = i; st.on = true; apply(true); } }
    else if (m.cmd === "on") { st.on = !!m.on; apply(st.on); }
    else if (m.cmd === "toggle") { st.on = !st.on; apply(st.on); }
    else if (m.cmd === "next" || m.cmd === "prev") { st.face = (st.face + (m.cmd === "next" ? 1 : -1) + FACES.length) % FACES.length; st.on = true; apply(true); }
  });
  addEventListener("storage", (e) => {   // another copy of this seat's avatar changed it (e.g. the same source in two scenes)
    if (e.key !== KEY) return;
    try { const s = (JSON.parse(e.newValue || "{}"))[id]; if (s) { st.on = !!s.on; st.face = s.face | 0; draw(st.face, false); setOn(st.on); } } catch (er) {}
  });
  st.face = Math.min(Math.max(0, st.face | 0), Math.max(0, FACES.length - 1));
  draw(st.face, false); setOn(st.on); report();
  AWYM.send({ to: "frame", id, cmd: "ping" });   // learn the frame's shape

  if (AWYM.param("test") === "1") {
    document.body.style.background = "#2b3a4a";
    const box = document.getElementById("test"); box.classList.add("on");
    box.innerHTML = FACES.map((f, i) => `<button data-n="${i + 1}">${f.name}</button>`).join("") + `<button data-off>Live camera</button><button data-talk>Talk</button>`;
    box.onclick = (e) => { const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.n) { st.face = Number(b.dataset.n) - 1; st.on = true; apply(true); }
      else if (b.dataset.off != null) { st.on = false; apply(false); }
      else talk(true, 0.8); };
  }
  window.AWYM_AVATAR = { state: () => Object.assign({}, st, { shown }), faces: FACES };
})();
</script>
</body>
</html>
