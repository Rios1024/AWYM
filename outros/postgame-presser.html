<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"speaker","type":"string","label":"Who’s at the podium","default":"Yo Momma"},
  {"id":"role","type":"string","label":"Their title","default":"Undefeated. Unbothered."},
  {"id":"quote","type":"string","label":"Closing quote","default":"I said what I said. Check the tape."},
  {"id":"signoff","type":"string","label":"Last line","default":"No further questions."}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Outro: Postgame Presser</title>
  <script src="player.js"></script>
  <script src="assets/gsap.min.js"></script>
  <link rel="stylesheet" href="assets/awym.css" />
  <!-- the overlay kit's colours and fonts (Theme Panel); the outro's own look applies without it -->
  <link rel="stylesheet" href="../theme.css" />
  <style>
    #wall { background: linear-gradient(180deg, #f3ece2, #e6dccd); }
    #repeat { left: -120px; top: -60px; width: 2200px; height: 900px; display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 150px; align-items: center; justify-items: center; }
    #repeat span { font-family: var(--font-display); font-size: 46px; color: var(--secondary); opacity: .9; }
    #repeat span:nth-child(odd) { color: var(--primary); font-size: 40px; }
    #table { left: -40px; right: -40px; bottom: 0; height: 330px; background: linear-gradient(180deg, #2a1747, #170c2a); border-top: 10px solid var(--primary); z-index: 3; }
    #table .skirt { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-family: var(--font-display); font-size: 70px; color: rgba(255,244,224,.85); letter-spacing: 6px; }
    #mics { left: 50%; bottom: 290px; width: 760px; height: 300px; margin-left: -380px; z-index: 4; }
    #mics svg { width: 100%; height: 100%; overflow: visible; }
    #placard { left: 50%; bottom: 300px; width: 540px; height: 90px; margin-left: -270px; z-index: 5; background: var(--light); border: 5px solid var(--dark); border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-size: 50px; text-transform: uppercase; color: var(--dark); transform: perspective(600px) rotateX(-12deg); }
    .fl { z-index: 20; width: 600px; height: 600px; margin: -300px 0 0 -300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,1), rgba(255,255,255,.4) 25%, rgba(255,255,255,0) 60%); opacity: 0; mix-blend-mode: screen; }
    #lt { z-index: 10; left: 90px; top: 90px; display: flex; flex-direction: column; }
    #lt .tag { align-self: flex-start; background: var(--warning); color: #fff; font-family: var(--font-heading); font-size: 40px; letter-spacing: 6px; padding: 4px 22px 6px; }
    #lt .nm { background: var(--dark); color: var(--light); font-family: var(--font-display); font-size: 64px; padding: 10px 28px 14px; }
    #lt .rl { align-self: flex-start; background: var(--gold); color: var(--dark); font-family: var(--font-body); font-weight: 700; font-size: 32px; letter-spacing: 4px; text-transform: uppercase; padding: 6px 22px; }
    #quote { z-index: 11; left: 50%; top: 330px; width: 1500px; margin-left: -750px; text-align: center; }
    #quote .q { display: inline-block; background: rgba(18,10,31,.88); color: var(--light); font-family: var(--font-heading); font-size: 76px; line-height: 1.1; text-transform: uppercase; padding: 26px 50px 32px; border-radius: 18px; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
    #quote .q em { font-style: normal; color: var(--primary); font-family: var(--font-display); }
    #stamp { z-index: 12; left: 50%; top: 600px; margin-left: -520px; width: 1040px; text-align: center; font-family: var(--font-display); font-size: 84px; color: var(--warning);
      border: 12px solid var(--warning); border-radius: 18px; padding: 10px 20px 14px; background: rgba(255,244,224,.9); box-shadow: 0 0 0 6px rgba(255,46,59,.25); }
    #end { z-index: 30; flex-direction: column; background: var(--dark); }
    #end .t { font-family: var(--font-display); font-size: 140px; line-height: .95; text-transform: uppercase; color: var(--light); text-align: center; text-shadow: 0 10px 0 var(--secondary), 0 0 60px rgba(242,107,29,.4); }
    #end .t em { font-style: normal; color: var(--primary); }
    #end .s { margin-top: 30px; font-family: var(--font-body); font-weight: 700; font-size: 44px; letter-spacing: 10px; text-transform: uppercase; color: var(--gold); }
    #black { z-index: 60; background: #000; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="postgame-presser" data-start="0" data-duration="13" data-width="1920" data-height="1080" data-fps="30">
    <div id="room" class="clip" data-start="0" data-duration="10.4" data-track-index="0">
      <div id="wall" class="abs" style="inset:0"></div>
      <div id="repeat" class="abs" aria-hidden="true" data-layout-ignore></div>
      <div id="mics" class="abs"><svg viewBox="0 0 760 300" id="micSvg"></svg></div>
      <div id="table" class="abs"><div class="skirt">POSTGAME</div></div>
      <div id="placard" class="abs"></div>
      <div id="lt" class="abs"><div class="tag">POSTGAME</div><div class="nm" id="nm"></div><div class="rl" id="rl"></div></div>
      <div id="quote" class="abs"><div class="q"><em>&ldquo;</em><span id="qt"></span><em>&rdquo;</em></div></div>
      <div id="stamp" class="abs" data-layout-allow-occlusion></div>
      <div id="flashes"></div>
    </div>
    <div id="end" class="clip center" data-start="10.2" data-duration="2.8" data-track-index="1">
      <div class="t">Argue with<br><em>Yo Momma!</em></div>
      <div class="s">See y'all next week</div>
    </div>
    <div id="grain-1" class="clip grain" data-start="0" data-duration="13" data-track-index="2" data-layout-allow-occlusion></div>
    <div id="vignette-1" class="clip vignette" data-start="0" data-duration="13" data-track-index="2" data-layout-allow-occlusion></div>
    <div id="black" class="clip" data-start="12.3" data-duration="0.7" data-track-index="3"></div>

    <audio id="sfx-fl0" data-start="0.5" data-duration="0.32" data-track-index="20" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl1" data-start="0.9" data-duration="0.32" data-track-index="21" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl2" data-start="1.4" data-duration="0.32" data-track-index="22" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl3" data-start="2.1" data-duration="0.32" data-track-index="23" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl4" data-start="2.6" data-duration="0.32" data-track-index="24" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl5" data-start="3.4" data-duration="0.32" data-track-index="25" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl6" data-start="4.6" data-duration="0.32" data-track-index="26" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl7" data-start="5.3" data-duration="0.32" data-track-index="27" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl8" data-start="6.1" data-duration="0.32" data-track-index="28" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl9" data-start="7.2" data-duration="0.32" data-track-index="29" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl10" data-start="8.0" data-duration="0.32" data-track-index="30" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl11" data-start="8.5" data-duration="0.32" data-track-index="31" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-fl12" data-start="9.2" data-duration="0.32" data-track-index="32" src="assets/sfx/shutter.wav" data-volume="0.45"></audio>
    <audio id="sfx-01-crowd" data-start="0" data-duration="7" data-track-index="10" src="assets/sfx/crowd.wav" data-volume="0.25"></audio>
    <audio id="sfx-02-typing" data-start="2.3" data-duration="1.2" data-track-index="11" src="assets/sfx/typing.wav" data-volume="0.35"></audio>
    <audio id="sfx-03-hit" data-start="7.25" data-duration="1.6" data-track-index="12" src="assets/sfx/hit.wav" data-volume="0.8"></audio>
    <audio id="sfx-04-beat" data-start="7.4" data-duration="5.6" data-track-index="13" src="assets/sfx/beat.wav" data-volume="0.5" data-fade-out="1.2"></audio>
    <audio id="sfx-05-hit" data-start="10.25" data-duration="1.6" data-track-index="14" src="assets/sfx/hit.wav" data-volume="0.5"></audio>
  </div>

  <script>
    const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
    const get = (k, d) => (V[k] === undefined || V[k] === "" ? d : String(V[k]));
    const speaker = get("speaker", "Yo Momma");
    document.getElementById("nm").textContent = speaker;
    document.getElementById("placard").textContent = speaker;
    document.getElementById("rl").textContent = get("role", "Undefeated. Unbothered.");
    const quote = get("quote", "I said what I said. Check the tape.");
    const qt = document.getElementById("qt");
    if (quote.length > 40) document.querySelector("#quote .q").style.fontSize = Math.max(44, 76 * 40 / quote.length) + "px";
    document.getElementById("stamp").textContent = get("signoff", "No further questions.");
    document.getElementById("repeat").innerHTML = Array.from({ length: 36 }, (_, i) => `<span>${i % 2 ? "AWYM" : "ARGUE WITH YO MOMMA!"}</span>`).join("");
    // microphones with coloured flags
    const MCOL = ["#F26B1D", "#FF3D7F", "#A238FF", "#FFB23E", "#3DD6FF", "#2E8B57", "#FF2E3B"];
    const svg = document.getElementById("micSvg"); let html = "";
    MCOL.forEach((c, i) => {
      const x = 70 + i * 103, tilt = (i - 3) * 7, h = 150 + (i % 3) * 30;
      html += `<g transform="rotate(${tilt} ${x} 300)"><rect x="${x - 5}" y="${300 - h}" width="10" height="${h}" fill="#2b2b33"/>
        <rect x="${x - 34}" y="${300 - h + 30}" width="68" height="46" rx="6" fill="${c}" stroke="#120A1F" stroke-width="4"/>
        <ellipse cx="${x}" cy="${300 - h}" rx="24" ry="32" fill="#3a3a44" stroke="#120A1F" stroke-width="4"/></g>`;
    });
    svg.innerHTML = html;
    // camera flashes at fixed spots and times (deterministic)
    const FL = [[300, 300, .5], [1600, 250, .9], [900, 180, 1.4], [200, 600, 2.1], [1700, 620, 2.6], [1200, 350, 3.4], [500, 200, 4.6], [1450, 160, 5.3], [700, 650, 6.1], [1100, 600, 7.2], [350, 420, 8.0], [1650, 420, 8.5], [900, 300, 9.2]];
    document.getElementById("flashes").innerHTML = FL.map((f, i) => `<div class="abs fl" data-layout-ignore id="fl${i}" style="left:${f[0]}px;top:${f[1]}px"></div>`).join("");

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#repeat", { x: 0 }, { x: -120, duration: 10.4, ease: "none" }, 0);
    tl.fromTo("#room", { scale: 1.12 }, { scale: 1, duration: 1.2, ease: "power2.out" }, 0);
    tl.fromTo("#mics", { y: 300 }, { y: 0, duration: .6, ease: "back.out(1.4)" }, .2);
    tl.fromTo("#placard", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: .4 }, .6);
    FL.forEach((f, i) => tl.fromTo("#fl" + i, { opacity: 1, scale: .3 }, { opacity: 0, scale: 1.1, duration: .35, ease: "power2.out" }, f[2]));
    tl.fromTo("#lt .tag", { x: -500 }, { x: 0, duration: .35, ease: "power3.out" }, 1.0);
    tl.fromTo("#lt .nm", { x: -900 }, { x: 0, duration: .4, ease: "power3.out" }, 1.15);
    tl.fromTo("#lt .rl", { x: -700 }, { x: 0, duration: .35, ease: "power3.out" }, 1.35);
    tl.fromTo("#quote .q", { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .4, ease: "back.out(1.8)" }, 2.0);
    const TYPE_AT = 2.3, TYPE_DUR = Math.min(3.2, quote.length * .07);
    const typeTo = (t) => { const k = Math.max(0, Math.min(1, (t - TYPE_AT) / TYPE_DUR)); qt.textContent = quote.slice(0, Math.round(k * quote.length)); };
    tl.eventCallback("onUpdate", () => typeTo(tl.time()));
    tl.fromTo("#stamp", { scale: 3, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -4, duration: .3, ease: "power4.in" }, 7.0);
    tl.to("#room", { x: 12, y: -8, duration: .05, yoyo: true, repeat: 5, ease: "none" }, 7.3).set("#room", { x: 0, y: 0 }, 7.6);
    tl.fromTo("#end .t", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: .35, ease: "power4.in" }, 10.25);
    tl.fromTo("#end .s", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: "power3.out" }, 10.8);
    tl.to("#end", { scale: 1.04, duration: 2.8, ease: "none" }, 10.2);
    tl.fromTo("#black", { opacity: 0 }, { opacity: 1, duration: .65 }, 12.3);

    window.__timelines = window.__timelines || {};
    window.__timelines["postgame-presser"] = tl;
    tl.seek(0); typeTo(0);
  </script>
</body>
</html>
