<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"leftName","type":"string","label":"Left side","default":"The Hosts"},
  {"id":"leftScore","type":"number","label":"Left score","default":98},
  {"id":"rightName","type":"string","label":"Right side","default":"Yo Momma"},
  {"id":"rightScore","type":"number","label":"Right score","default":104},
  {"id":"take","type":"string","label":"Take of the night","default":"“The midrange is NOT dead.”"},
  {"id":"nextTitle","type":"string","label":"Next episode","default":"All-time starting five: no repeats"},
  {"id":"when","type":"string","label":"When","default":"New episode next week"}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Outro: Final Score</title>
  <script src="player.js"></script>
  <script src="assets/gsap.min.js"></script>
  <link rel="stylesheet" href="assets/awym.css" />
  <!-- the overlay kit's colours and fonts (Theme Panel); the outro's own look applies without it -->
  <link rel="stylesheet" href="../theme.css" />
  <style>
    #bg { background: radial-gradient(ellipse 80% 60% at 50% 30%, #2b1650 0%, #170c2a 55%, #0b0614 100%); }
    /* arena lights: dotted rows */
    #lights { left: 0; right: 0; top: 0; height: 220px; opacity: .55;
      background: radial-gradient(circle, rgba(255,226,170,.9) 0 3px, transparent 4px) 0 0 / 46px 46px;
      -webkit-mask-image: linear-gradient(180deg, #000, transparent); mask-image: linear-gradient(180deg, #000, transparent); }
    #haze { background: radial-gradient(ellipse 50% 35% at 50% 0%, rgba(255,190,120,.25), transparent 70%); }

    /* jumbotron */
    #board { left: 50%; top: 120px; width: 1500px; height: 690px; margin-left: -750px; border-radius: 36px; transform-origin: 50% 0;
      background: linear-gradient(180deg, #1a0f2e, #0c0716); border: 8px solid #3b2560;
      box-shadow: 0 0 0 4px #0c0716, 0 30px 80px rgba(0,0,0,.7), inset 0 0 120px rgba(162,56,255,.15); overflow: hidden; }
    #board .pix { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.05) 0 1px, transparent 1.5px) 0 0 / 8px 8px; pointer-events: none; }
    #final { position: absolute; left: 0; right: 0; top: 0; height: 120px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(90deg, #c94912, var(--primary) 30%, var(--gold) 50%, var(--primary) 70%, #c94912);
      font-family: var(--font-display); font-size: 74px; letter-spacing: 18px; color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
    .side { position: absolute; top: 150px; width: 640px; height: 330px; display: flex; flex-direction: column; align-items: center; }
    #L { left: 40px; } #R { right: 40px; }
    .name { font-family: var(--font-heading); font-size: 70px; letter-spacing: 4px; text-transform: uppercase; color: var(--light); white-space: nowrap; }
    .score { font-family: var(--font-display); font-size: 230px; line-height: 1; color: var(--gold);
      text-shadow: 0 0 30px rgba(255,178,62,.7), 0 0 70px rgba(255,178,62,.35); font-variant-numeric: tabular-nums; }
    #R .score { color: var(--accent); text-shadow: 0 0 30px rgba(255,61,127,.75), 0 0 70px rgba(255,61,127,.35); }
    #vs { position: absolute; left: 50%; top: 250px; width: 140px; margin-left: -70px; text-align: center; font-family: var(--font-display);
      font-size: 64px; color: rgba(255,244,224,.35); }
    #take { position: absolute; left: 0; right: 0; bottom: 14px; height: 100px; display: flex; align-items: center; justify-content: center; gap: 24px;
      border-top: 3px solid rgba(255,255,255,.08); }
    #take b { font-family: var(--font-body); font-weight: 700; font-size: 34px; letter-spacing: 4px; text-transform: uppercase; color: var(--secondary);
      background: var(--gold); padding: 4px 18px 6px; border-radius: 8px; }
    #take span { font-family: var(--font-body); font-weight: 600; font-size: 48px; color: var(--light); }
    .stamp { position: absolute; top: 486px; width: 420px; height: 62px; display: flex; align-items: center; justify-content: center; gap: 16px;
      border-radius: 12px; background: var(--warning); color: #fff; font-family: var(--font-display); font-size: 40px; letter-spacing: 6px;
      box-shadow: 0 8px 0 #8f1018, 0 0 40px rgba(255,46,59,.55); z-index: 2; }
    .stamp big { font-size: 40px; }
    .stamp small { font-size: 40px; }

    /* next episode */
    #next { z-index: 5; left: 50%; top: 832px; width: 1500px; margin-left: -750px; height: 200px; display: flex; align-items: center; gap: 40px; }
    #next .tag { flex: none; font-family: var(--font-display); font-size: 46px; line-height: 1; color: #fff; background: var(--accent);
      padding: 26px 30px 22px; border-radius: 18px; transform: rotate(-3deg); box-shadow: 0 10px 0 #9c1f4b; text-align: center; }
    #next .txt { display: flex; flex-direction: column; overflow: hidden; }
    #nextTitle { font-family: var(--font-heading); font-size: 74px; letter-spacing: 2px; text-transform: uppercase; color: var(--light); line-height: 1.05; white-space: nowrap; }
    #when { font-family: var(--font-body); font-weight: 700; font-size: 40px; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); }

    #logo { z-index: 8; flex-direction: column; }
    #logo .t { font-family: var(--font-display); font-size: 150px; line-height: .95; text-align: center; color: var(--light); text-transform: uppercase;
      text-shadow: 0 10px 0 var(--secondary), 0 0 60px rgba(242,107,29,.4); }
    #logo .t em { font-style: normal; color: var(--primary); }
    #logo .s { margin-top: 30px; font-family: var(--font-body); font-weight: 700; font-size: 46px; letter-spacing: 12px; text-transform: uppercase; color: var(--gold); }
    #black { background: #000; z-index: 60; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="final-score" data-start="0" data-duration="14" data-width="1920" data-height="1080" data-fps="30">
    <div id="stage" class="clip" data-start="0" data-duration="14" data-track-index="0">
      <div id="bg" class="abs" style="inset:0"></div>
      <div id="haze" class="abs" style="inset:0"></div>
      <div id="lights" class="abs"></div>
    </div>

    <div id="boardwrap" class="clip" data-start="0" data-duration="10.6" data-track-index="1">
      <div id="board" class="abs">
        <div id="final">FINAL</div>
        <div class="side" id="L"><div class="name" id="ln"></div><div class="score" id="ls">0</div></div>
        <div id="vs">VS</div>
        <div class="side" id="R"><div class="name" id="rn"></div><div class="score" id="rs">0</div></div>
        <div id="take"><b>Take of the night</b><span id="takeTxt"></span></div>
        <div class="pix"></div>
        <div class="stamp" id="stamp"><big>★</big><small>WINNER</small><big>★</big></div>
      </div>
      <div id="next" class="abs">
        <div class="tag">NEXT<br>TIME</div>
        <div class="txt"><div id="nextTitle"></div><div id="when"></div></div>
      </div>
    </div>

    <div id="logo" class="clip center" data-start="10.4" data-duration="3.6" data-track-index="2">
      <div class="t">Argue with<br><em>Yo Momma!</em></div>
      <div class="s">Settle it in the comments</div>
    </div>

    <div id="grain-1" class="clip grain" data-layout-allow-occlusion data-start="0" data-duration="14" data-track-index="5"></div>
    <div id="vignette-2" class="clip vignette" data-layout-allow-occlusion data-start="0" data-duration="14" data-track-index="5"></div>
    <div id="black" class="clip" data-start="13.1" data-duration="0.9" data-track-index="6"></div>

    <audio id="sfx-01-beat" data-start="0" data-duration="10.43" data-track-index="10" src="assets/sfx/beat.wav" data-volume="0.5" data-fade-in="0.6"></audio>
    <audio id="sfx-02-beat" data-start="10.43" data-duration="3.57" data-track-index="11" src="assets/sfx/beat.wav" data-volume="0.5" data-fade-out="2"></audio>
    <audio id="sfx-03-whoosh" data-start="0.6" data-duration="0.8" data-track-index="12" src="assets/sfx/whoosh.wav" data-volume="0.6"></audio>
    <audio id="sfx-04-buzzer" data-start="3.6" data-duration="1.5" data-track-index="13" src="assets/sfx/buzzer.wav" data-volume="0.45"></audio>
    <audio id="sfx-05-hit" data-start="4.15" data-duration="1.6" data-track-index="14" src="assets/sfx/hit.wav" data-volume="0.8"></audio>
    <audio id="sfx-06-crowd" data-start="4.2" data-duration="5" data-track-index="15" src="assets/sfx/crowd.wav" data-volume="0.4" data-fade-out="1.5"></audio>
    <audio id="sfx-07-whoosh" data-start="6.2" data-duration="0.8" data-track-index="16" src="assets/sfx/whoosh.wav" data-volume="0.55"></audio>
    <audio id="sfx-08-whoosh" data-start="10.3" data-duration="0.8" data-track-index="17" src="assets/sfx/whoosh.wav" data-volume="0.6"></audio>
    <audio id="sfx-09-hit" data-start="10.75" data-duration="1.6" data-track-index="18" src="assets/sfx/hit.wav" data-volume="0.55"></audio>
  </div>

  <script>
    const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
    const get = (k, d) => (V[k] === undefined || V[k] === "" ? d : V[k]);
    const LN = get("leftName", "The Hosts"), RN = get("rightName", "Yo Momma");
    const LS = Math.round(Number(get("leftScore", 98))) || 0, RS = Math.round(Number(get("rightScore", 104))) || 0;
    document.getElementById("ln").textContent = LN;
    document.getElementById("rn").textContent = RN;
    document.getElementById("takeTxt").textContent = get("take", "“The midrange is NOT dead.”");
    document.getElementById("nextTitle").textContent = get("nextTitle", "All-time starting five: no repeats");
    document.getElementById("when").textContent = get("when", "New episode next week");
    const leftWins = LS >= RS;
    const stamp = document.getElementById("stamp");
    stamp.style.left = leftWins ? "150px" : "auto"; stamp.style.right = leftWins ? "auto" : "150px";
    // fit long names
    [["ln"], ["rn"]].forEach(([id]) => { const el = document.getElementById(id); const n = el.textContent.length; if (n > 14) el.style.fontSize = Math.max(40, 70 * 14 / n) + "px"; });
    const nt = document.getElementById("nextTitle"); if (nt.textContent.length > 30) nt.style.fontSize = Math.max(44, 74 * 30 / nt.textContent.length) + "px";

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#lights", { backgroundPositionX: 0 }, { backgroundPositionX: 46 * 6, duration: 14, ease: "none" }, 0);
    tl.fromTo("#board", { rotationX: -80, y: -200, opacity: 0, transformPerspective: 1600 }, { rotationX: 0, y: 0, opacity: 1, duration: .9, ease: "back.out(1.3)" }, .5);
    tl.fromTo("#final", { scaleX: 1.6, opacity: 0 }, { scaleX: 1, opacity: 1, duration: .6, ease: "power3.out" }, 1.0);
    tl.fromTo([".name"], { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .45, stagger: .12, ease: "power2.out" }, 1.3);

    // scores roll up
    const sc = { l: 0, r: 0 };
    const ls = document.getElementById("ls"), rs = document.getElementById("rs");
    tl.to(sc, { l: LS, r: RS, duration: 2.1, ease: "power2.out", onUpdate: () => { ls.textContent = Math.round(sc.l); rs.textContent = Math.round(sc.r); } }, 1.5);
    tl.set(sc, { l: LS, r: RS, onComplete: () => { ls.textContent = LS; rs.textContent = RS; } }, 3.61);
    tl.fromTo(".score", { scale: .7 }, { scale: 1, duration: 2.1, ease: "power2.out" }, 1.5);

    // winner
    const win = leftWins ? "#L" : "#R", lose = leftWins ? "#R" : "#L";
    tl.to(lose, { opacity: .35, duration: .4 }, 3.8);
    tl.to(win + " .score", { scale: 1.12, duration: .3, ease: "back.out(3)" }, 3.75);
    tl.fromTo("#stamp", { scale: 3, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: -3, duration: .3, ease: "power4.in" }, 3.9);
    tl.to("#board", { x: 14, y: 8, duration: .05, yoyo: true, repeat: 5, ease: "none" }, 4.2).set("#board", { x: 0, y: 0 }, 4.5);
    tl.fromTo("#take", { y: 110, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: "power3.out" }, 4.9);

    // next time
    tl.set("#next", { opacity: 0 }, 0).set("#next", { opacity: 1 }, 6.2);
    tl.fromTo("#next .tag", { x: -500, rotation: -25 }, { x: 0, rotation: -3, duration: .6, ease: "back.out(1.6)" }, 6.2);
    tl.fromTo("#nextTitle", { y: 100 }, { y: 0, duration: .55, ease: "power3.out" }, 6.45);
    tl.fromTo("#when", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: "power3.out" }, 6.7);
    tl.to("#next .tag", { scale: 1.06, duration: .45, yoyo: true, repeat: 3, ease: "sine.inOut" }, 7.6);

    // out to the logo
    tl.to("#board", { y: -900, rotationX: 40, duration: .7, ease: "power3.in" }, 10.0);
    tl.to("#next", { y: 400, opacity: 0, duration: .5, ease: "power3.in" }, 10.05);
    tl.fromTo("#logo .t", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: .38, ease: "power4.in" }, 10.4);
    tl.fromTo("#logo .s", { y: 40, opacity: 0, scaleX: 1.4 }, { y: 0, opacity: 1, scaleX: 1, duration: .6, ease: "power3.out" }, 11.0);
    tl.to("#logo", { scale: 1.05, duration: 3.6, ease: "none" }, 10.4);
    tl.fromTo("#black", { opacity: 0 }, { opacity: 1, duration: .9, ease: "power1.in" }, 13.1);

    window.__timelines = window.__timelines || {};
    window.__timelines["final-score"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
